<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>3D-Druck Kosten Rechner</title>

<style>
:root{
  --bg:#f4f4f4;
  --card:#ffffff;
  --text:#000000;
  --border:#cccccc;
  --accent:#ffcc00;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121212;
    --card:#1e1e1e;
    --text:#f1f1f1;
    --border:#333333;
  }
}

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  display:flex;
  justify-content:center;
  padding:16px;
}

.container{width:100%;max-width:380px;}

.card{
  background:var(--card);
  border-radius:14px;
  padding:16px;
  margin-bottom:6px;
}

ul{list-style:none;padding:0;margin:0;}

li{
  display:flex;
  align-items:center;
  margin-bottom:12px;
  gap:18px;
}

label{flex:1;font-weight:600;}

.input-wrap{
  flex:0 0 150px;
  display:flex;
  justify-content:center;
}

input{
  width:130px;
  padding:10px;
  font-size:16px;
  border-radius:8px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  text-align:center;
}

.time-inputs{display:flex;gap:8px;}
.time-inputs input{width:62px;}

.results{
  display:none;
}

.results.visible{
  display:block;
}

.results-list div{
  text-align:center;
  margin-bottom:6px;
}

.results-total{
  margin-top:12px;
  text-align:center;
  font-size:1.7em;
  font-weight:bold;
  color:var(--accent);
}

.results-hour{
  margin-top:6px;
  text-align:center;
  font-size:0.95em;
  opacity:.8;
}

button{
  margin-top:8px;
  width:100%;
  padding:10px;
  font-size:15px;
  border-radius:8px;
  border:1px solid var(--border);
  background:transparent;
}
</style>
</head>

<body>
<div class="container">

<div class="card">
<ul>
<li><label>Filament €/kg</label><div class="input-wrap"><input id="plaPreis" type="number"></div></li>
<li><label>Ø Leistungsaufnahme (W)</label><div class="input-wrap"><input id="leistung" type="number"></div></li>
<li><label>Strom €/kWh</label><div class="input-wrap"><input id="strompreis" type="number"></div></li>
<li><label>Verschleiß €/h</label><div class="input-wrap"><input id="verschleiss" type="number"></div></li>
<li><label>Fehldruck-Puffer %</label><div class="input-wrap"><input id="fehlerProzent" type="number"></div></li>
<li><label>Wartung €/h</label><div class="input-wrap"><input id="wartung" type="number"></div></li>
<li><label>Versandkosten €</label><div class="input-wrap"><input id="versand" type="number" step="0.01"></div></li>

<li>
  <label>Druckzeit</label>
  <div class="input-wrap time-inputs">
    <input id="druckzeitStunden" type="number" placeholder="h">
    <input id="druckzeitMinuten" type="number" placeholder="min">
  </div>
</li>

<li><label>Material (g)</label><div class="input-wrap"><input id="material" type="number"></div></li>
</ul>
</div>

<div class="card results" id="results">
  <div class="results-list">
    <div>Material: <span id="mk"></span> €</div>
    <div>Fehldruck-Puffer: <span id="fk"></span> €</div>
    <div>Strom: <span id="sk"></span> €</div>
    <div>Verschleiß: <span id="vk"></span> €</div>
    <div>Wartung: <span id="wk"></span> €</div>
    <div id="versandRow" style="display:none">Versand: <span id="versandK"></span> €</div>
  </div>

  <div class="results-total">
    Gesamt: <span id="gesamt"></span> €
  </div>

  <div class="results-hour">
    ≈ <span id="proStunde"></span> € / h
  </div>

  <div class="results-hour" id="versandProzentRow" style="display:none">
    Versand beträgt <span id="versandProzent"></span> %
  </div>

  <button onclick="copyMessage()">📋 Nachricht kopieren</button>
</div>

</div>

<script>
const inputs = document.querySelectorAll("input");
const results = document.getElementById("results");

inputs.forEach(i => i.addEventListener("input", calc));

function get(id){
  const v = parseFloat(document.getElementById(id).value);
  return isNaN(v) ? 0 : v;
}

function calc(){
  const pla = get("plaPreis");
  const watt = get("leistung");
  const strom = get("strompreis");
  const versch = get("verschleiss");
  const fehlerP = get("fehlerProzent");
  const wart = get("wartung");
  const mat = get("material");
  const versand = get("versand");

  const h = get("druckzeitStunden");
  const m = get("druckzeitMinuten");
  const min = h * 60 + m;

  if(!pla || !watt || !strom || !versch || !mat || min <= 0){
    results.classList.remove("visible");
    return;
  }

  const hrs = min / 60;

  const materialKosten = (mat / 1000) * pla;
  const stromKosten = (watt / 1000) * hrs * strom;
  const verschKosten = hrs * versch;
  const wartKosten = hrs * wart;

  const fehlerBasis = materialKosten + verschKosten;
  const fehlerKosten = fehlerBasis * (fehlerP / 100);

  const grundKosten =
    materialKosten +
    fehlerKosten +
    stromKosten +
    verschKosten +
    wartKosten;

  const gesamtKosten = grundKosten + (versand > 0 ? versand : 0);

  mk.textContent = materialKosten.toFixed(2);
  fk.textContent = fehlerKosten.toFixed(2);
  sk.textContent = stromKosten.toFixed(2);
  vk.textContent = verschKosten.toFixed(2);
  wk.textContent = wartKosten.toFixed(2);
  gesamt.textContent = gesamtKosten.toFixed(2);
  proStunde.textContent = (gesamtKosten / hrs).toFixed(2);

  if(versand > 0){
    versandRow.style.display = "block";
    versandK.textContent = versand.toFixed(2);

    const pct = (versand / grundKosten) * 100;
    versandProzent.textContent = pct.toFixed(1);
    versandProzentRow.style.display = "block";
  } else {
    versandRow.style.display = "none";
    versandProzentRow.style.display = "none";
  }

  results.classList.add("visible");
}

function copyMessage(){
  const hasVersand = versandRow.style.display !== "none";

  const text =
`🖨️ *3D-Druck Kosten*

————————————
💰 *Gesamt: ${gesamt.textContent} €*
————————————
${hasVersand ? `📦 Versand: ${versandK.textContent} € (${versandProzent.textContent} %)\n` : ""}ℹ️ Details zur Kostenberechnung:
https://rubenh05-prog.github.io/3d-kosten-pwa/`;

  navigator.clipboard.writeText(text).then(()=>{
    alert("Nachricht wurde kopiert ✅");
  });
}
</script>
</body>
</html>
