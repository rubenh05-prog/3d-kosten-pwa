<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>3D-Druck Kosten Rechner</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="3D-Druck">
<link rel="apple-touch-icon" href="icon-192.png">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffcc00">
<meta name="color-scheme" content="light dark">

<style>
:root{
  --bg:#f4f4f4;
  --card:#ffffff;
  --text:#000000;
  --border:#cccccc;
  --accent:#ffcc00;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121212;
    --card:#1e1e1e;
    --text:#f1f1f1;
    --border:#333333;
  }
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  display:flex;
  justify-content:center;
  padding:16px;
}

.container{width:100%;max-width:380px;}

.card{
  background:var(--card);
  border-radius:14px;
  padding:16px;
}
.card.top{border-top:6px solid var(--accent);margin-bottom:6px;}
.card.results{margin-bottom:6px;}
.card.results:not(.visible){margin-bottom:0;}

ul{list-style:none;padding:0;margin:0;}

li{
  display:flex;
  align-items:center;
  margin-bottom:12px;
  gap:18px;
}

label{flex:1;font-weight:600;font-size:16px;}

.input-wrap{
  flex:0 0 150px;
  display:flex;
  justify-content:center;
}

input{
  width:130px;
  padding:10px;
  font-size:16px;
  border-radius:8px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  text-align:center;
}

.time-inputs{display:flex;gap:8px;}
.time-inputs input{width:62px;}

.results{
  opacity:0;
  max-height:0;
  overflow:hidden;
  transition:.2s ease;
}
.results.visible{
  opacity:1;
  max-height:1000px;
}

.results-list div{
  text-align:center;
  margin-bottom:6px;
}

.results-total{
  margin-top:12px;
  text-align:center;
  font-size:1.7em;
  font-weight:bold;
  color:var(--accent);
}

.results-hour{
  margin-top:6px;
  text-align:center;
  font-size:0.95em;
  opacity:.75;
}

.footer{
  text-align:center;
  font-size:13px;
  opacity:.7;
  margin-top:4px;
}

button{
  margin-top:8px;
  width:100%;
  padding:10px;
  font-size:15px;
  border-radius:8px;
  border:1px solid var(--border);
  background:transparent;
  color:var(--text);
}
button:active{transform:scale(.98);}

#langSwitch{
  position:fixed;
  top:10px;
  right:10px;
  display:flex;
  gap:6px;
  z-index:1000;
}
#langSwitch button{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:6px;
  font-size:18px;
  padding:4px 6px;
  cursor:pointer;
}
</style>
</head>

<body>

<div id="langSwitch">
  <button onclick="setLang('de')" aria-label="Deutsch">🇩🇪</button>
  <button onclick="setLang('en')" aria-label="English">🇬🇧</button>
</div>

<div class="container">

<div class="card top">
<ul>
<li><label data-i18n="filament">Filament Euro/kg</label><div class="input-wrap"><input id="plaPreis" type="number" min="0"></div></li>
<li><label data-i18n="power">Leistung (W) Durchschnitt</label><div class="input-wrap"><input id="leistung" type="number" min="0"></div></li>
<li><label data-i18n="electricity">Strom Euro/kWh</label><div class="input-wrap"><input id="strompreis" type="number" min="0"></div></li>
<li><label data-i18n="wear">Verschleiss Euro/h</label><div class="input-wrap"><input id="verschleiss" type="number" min="0"></div></li>
<li><label data-i18n="fail">Fehldruck-Puffer Prozent</label><div class="input-wrap"><input id="fehlerProzent" type="number" min="0"></div></li>
<li><label data-i18n="maintenance">Wartung und Pflege Euro/h</label><div class="input-wrap"><input id="wartung" type="number" min="0"></div></li>

<li>
  <label data-i18n="printtime">Druckzeit</label>
  <div class="input-wrap time-inputs">
    <input id="druckzeitStunden" type="number" placeholder="h" min="0">
    <input id="druckzeitMinuten" type="number" placeholder="min" min="0">
  </div>
</li>

<li><label data-i18n="material">Material (g)</label><div class="input-wrap"><input id="material" type="number" min="0"></div></li>
</ul>

<button onclick="resetToDefaults()" data-i18n="reset">🔄 Standardwerte wiederherstellen</button>
<button onclick="toggleInfo()" data-i18n="info">ℹ️ Wie wird gerechnet?</button>
</div>

<div class="card results" id="infoBox">
  <div class="results-list" style="font-size:14px;text-align:left">
    <strong data-i18n="info">Wie wird gerechnet?</strong><br><br>

    <strong>Material</strong><br>
    (g / 1000) × Euro/kg<br><br>

    <strong>Electricity</strong><br>
    (W / 1000) × h × Euro/kWh<br><br>

    <em>Kein Gewinn – nur Kostendeckung.</em>
  </div>
</div>

<div class="card results" id="results">
  <div class="results-list">
    <div>Material: <span id="mk">0.00</span> Euro</div>
    <div>Fehldruck-Puffer: <span id="fk">0.00</span> Euro</div>
    <div>Strom: <span id="sk">0.00</span> Euro</div>
    <div>Verschleiss: <span id="vk">0.00</span> Euro</div>
    <div>Wartung und Pflege: <span id="wk">0.00</span> Euro</div>
  </div>

  <div class="results-total">
    <span data-i18n="total">Gesamt</span>: <span id="gesamt">0.00</span> Euro
  </div>

  <div class="results-hour">
    ≈ <span id="proStunde">0.00</span> Euro / h
  </div>
</div>

<div class="footer" id="lastChange"></div>
</div>

<script>
const KEY="druckkosten_state";
const LANG_KEY="druckkosten_lang";

const i18n={
  de:{
    filament:"Filament Euro/kg",
    power:"Leistung (W) Durchschnitt",
    electricity:"Strom Euro/kWh",
    wear:"Verschleiss Euro/h",
    fail:"Fehldruck-Puffer Prozent",
    maintenance:"Wartung und Pflege Euro/h",
    printtime:"Druckzeit",
    material:"Material (g)",
    reset:"Standardwerte wiederherstellen",
    info:"Wie wird gerechnet?",
    total:"Gesamt",
    last:"Letzte Änderung"
  },
  en:{
    filament:"Filament €/kg",
    power:"Average power (W)",
    electricity:"Electricity €/kWh",
    wear:"Wear €/h",
    fail:"Failure buffer percent",
    maintenance:"Maintenance €/h",
    printtime:"Print time",
    material:"Material (g)",
    reset:"Restore defaults",
    info:"How is it calculated?",
    total:"Total",
    last:"Last change"
  }
};

function setLang(lang){
  localStorage.setItem(LANG_KEY,lang);
  applyLang(lang);
}

function applyLang(lang){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const key=el.dataset.i18n;
    if(i18n[lang][key]) el.textContent=i18n[lang][key];
  });
}

applyLang(localStorage.getItem(LANG_KEY)||"de");
</script>

</body>
</html>
